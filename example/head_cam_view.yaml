# Head camera stereo panel in the VR device.
#
# Read on every request, so edit and reload the page to apply.
#
# These values come from the camera's own calibration. To regenerate
# them, with --working-distance set to the distance usually worked at:
#
#   python example/zed_view_parameters.py --working-distance 0.75
#
# Add --measure, with the camera free, to check the eye alignment
# against the camera instead of trusting the calibration:
#
#   python example/zed_view_parameters.py --measure

session:
  # immersive-ar keeps the room visible around the image, immersive-vr
  # blacks it out.
  mode: immersive-vr

camera:
  # How much of the view the image covers, in degrees.
  #
  # The ZED sees 79.4x50.1 and the Quest 3 shows about 110x96, so at the
  # camera's own values the image covers 42% of the display and the rest
  # is black. Larger values fill more of it but magnify, which magnifies
  # how far apart the two eyes' images sit and narrows the depth range
  # that fuses. Pick a row:
  #
  #   79.4 x  50.1   42% filled   fuses 0.61-0.96 m   no magnification
  #   92.1 x  60.6   53% filled   fuses 0.64-0.91 m   1.25x
  #  102.5 x  70.1   63% filled   fuses 0.65-0.88 m   1.5x
  #  110.9 x  78.6   74% filled   fuses 0.67-0.86 m   1.75x
  #  126.3 x  96.1  100% filled   fuses 0.69-0.83 m   2.4x, Quest 3 only
  #
  # Keep to a row: the pairs hold the camera's shape, and mixing them
  # stretches the image. Fusing ranges are for convergence at 0.75 m.
  horizontal_fov: 79.4
  vertical_fov: 50.1

panel:
  # Where the panel sits, in meters. Sets the depth the eyes converge
  # at, not how large the image looks. A Quest 3 focuses at about 1.3 m
  # whatever is drawn, so matching it is easiest on the eyes.

  distance: 1.3

stereo:
  # Right eye offsets in source pixels, correcting for the two lenses
  # not being aligned. Both scale with the image, so they hold at any
  # field of view above.

  # Up and down. Measured from the camera with zed_view_parameters.py --measure, 
  # the calibration predicts 14.1 from the lens centres and pitch, 
  # but the images themselves show 10.0.
  vertical_align: 10.0

  # Sideways. 
  # More negative pulls the scene closer to the eyes, more positive pushes it away.
  convergence: -1.7
