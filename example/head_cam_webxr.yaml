# Head stereo camera shown in the VR device, without arms, so the view
# can be checked on its own.
#
# Tuned in `head_cam_view.yaml`; edit it and reload the page to apply.

nodes:
  # One node opens the device, dora fans the frames out. /dev/video*
  # can only be opened once.
  - id: camera-head-stereo
    build: pip install opencv-video-capture
    path: opencv-video-capture
    restart_policy: on-failure
    env:
      CAPTURE_PATH: "/dev/camera_head_stereo"
      ENCODING: "bgr8"
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    inputs:
      tick: dora/timer/millis/33
    outputs:
      - image

  # Splits 2560x720 side-by-side into two 1280x720 JPEGs: `image_0`
  # left eye, `image_1` right. A recorder can read the same outputs, so
  # what is seen and what is recorded are the same data.
  - id: camera-head-stereo-splitter
    build: pip install git+https://github.com/enactic/dora-opencv-image-splitter
    path: dora-opencv-image-splitter
    inputs:
      tick: dora/timer/millis/33
      image: camera-head-stereo/image
    env:
      SPLIT_MODE: "vertical"
      NUM_SPLITS: 2
      JPEG_QUALITY: 90
      IMAGE_HEIGHT: 720
      IMAGE_WIDTH: 2560
    outputs:
      - image_0
      - image_1

  - id: webxr
    build: pip install -e ..
    path: dora-openarm-webxr
    env:
      TLS_CERTIFICATE_FILE: "server.crt"
      TLS_KEY_FILE: "server.key"
      VIEW_CONFIGURATION_FILE: "head_cam_view.yaml"
    inputs:
      tick: dora/timer/secs/1
      # Keeps the view on the newest frame. Without it, frames the VR
      # device cannot keep up with queue and latency grows.
      camera_head_left:
        source: camera-head-stereo-splitter/image_0
        queue_size: 1
      camera_head_right:
        source: camera-head-stereo-splitter/image_1
        queue_size: 1
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_x_right
      - joystick_y_right
      - joystick_x_left
      - joystick_y_left
      - button_a
      - button_b
      - button_x
      - button_y
      - status
      - vr_receive_times
